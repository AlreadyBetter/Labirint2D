name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Labirint2D.sln /p:Configuration=Release

      - name: Pack build
        shell: powershell
        run: |
          Compress-Archive `
            -Path "Labirint2D\bin\Release\*" `
            -DestinationPath "Labirint2D-${{ github.ref_name }}-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Labirint2D
          path: Labirint2D\bin\Release\

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Labirint2D-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
